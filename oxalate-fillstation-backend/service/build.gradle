plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.dependency.management)
    alias(libs.plugins.hibernate.orm)
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

group = 'io.oxalate.fillstation'
version = libs.versions.release.version.get()

bootJar {
    archiveFileName = "${rootProject.name}-${version}.jar"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion
                .of(libs.versions.java.get())
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation dependencies
            .project(path: ':api')
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-session-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.flywaydb:flyway-database-postgresql"
    implementation libs.springdoc.openapi
    implementation "org.thymeleaf.extras:thymeleaf-extras-springsecurity6"
    implementation libs.jjwt.api
    compileOnly "org.projectlombok:lombok"
    developmentOnly "org.springframework.boot:spring-boot-docker-compose"
    runtimeOnly "org.postgresql:postgresql"
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    annotationProcessor "org.projectlombok:lombok"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testRuntimeOnly libs.junit.platform.launcher
}

hibernate {
    enhancement {
        enableAssociationManagement = false
    }
}

tasks
        .named('test') {
            useJUnitPlatform()
            finalizedBy jacocoTestReport
        }

jacocoTestReport {
    dependsOn test
    reports {
        xml
                .required = true
    }
}

// When running the application locally via `./gradlew bootRun` we don't want
// Spring Boot to automatically start Docker Compose containers. The project
// includes `spring-boot-docker-compose` as a developmentOnly dependency for
// CI/local convenience, but for developers starting the JVM directly we
// prefer to connect to a manually started Postgres on port 5432. Disable the
// Docker Compose lifecycle by passing the system property when Gradle's
// `bootRun` task launches the JVM.
bootRun {
    jvmArgs = ["-Dspring.docker.compose.enabled=false"]
}
