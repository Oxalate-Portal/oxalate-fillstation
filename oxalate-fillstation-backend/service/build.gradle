plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${dependencyManagementPluginVersion}"
    id 'org.hibernate.orm' version "${hibernateOrmPluginVersion}"
}

group = 'io.oxalate.fillstation'
version = project
        .releaseVersion

bootJar {
    archiveFileName = "${rootProject.name}-${version}.jar"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion
                .of("${javaVersion}")
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation dependencies
            .project(path: ':api')
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-session-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.flywaydb:flyway-database-postgresql"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
    implementation "org.thymeleaf.extras:thymeleaf-extras-springsecurity6"
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    compileOnly "org.projectlombok:lombok"
    developmentOnly "org.springframework.boot:spring-boot-docker-compose"
    runtimeOnly "org.postgresql:postgresql"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    annotationProcessor "org.projectlombok:lombok"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"
}

hibernate {
    enhancement {
        enableAssociationManagement = false
    }
}

tasks
        .named('test') {
            useJUnitPlatform()
        }

// When running the application locally via `./gradlew bootRun` we don't want
// Spring Boot to automatically start Docker Compose containers. The project
// includes `spring-boot-docker-compose` as a developmentOnly dependency for
// CI/local convenience, but for developers starting the JVM directly we
// prefer to connect to a manually started Postgres on port 5432. Disable the
// Docker Compose lifecycle by passing the system property when Gradle's
// `bootRun` task launches the JVM.
bootRun {
    jvmArgs = ["-Dspring.docker.compose.enabled=false"]
}
