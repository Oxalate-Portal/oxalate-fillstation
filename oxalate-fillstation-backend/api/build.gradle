plugins {
    id 'java-library'
    id "io.freefair.lombok" version "${ioFreeFairLombok}"
    id 'maven-publish'
    id "jacoco"
}

group = 'io.oxalate.fillstation'
version = project
        .releaseVersion

jar {
    archiveFileName = "${rootProject.name}-api-${version}.jar"
}

java {
    // Attach sources and javadoc for Maven consumers
    withSourcesJar()
    withJavadocJar()
}

// Quiet javadoc warnings as we're using Lombok which does not generate documentation for the generated methods
tasks
        .withType(Javadoc)
        .configureEach {
            options
                    .addStringOption('Xdoclint:all,-missing', '-quiet') // keep other checks, ignore missing docs
        }

repositories {
    mavenCentral()
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
    api "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    api "org.springframework.data:spring-data-jpa:${springDataJpaVersion}"
    implementation "io.swagger.core.v3:swagger-annotations:${swaggerVersion}"
    implementation "org.springframework.boot:spring-boot-starter-security:${springBootVersion}"
    implementation "jakarta.validation:jakarta.validation-api:${jakartaValidationVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.junit.platform:junit-platform-launcher:${junitVersion}"
}

jacoco {
    toolVersion = jacocoVersion
}

tasks
        .named('test') {
            useJUnitPlatform()
        }

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml
                .required = true
    }
}
